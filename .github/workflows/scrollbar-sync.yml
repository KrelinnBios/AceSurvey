name: Scrollbar Style Sync

on:
  push:
    paths:
      - .scrollbar-sync-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply scrollbar style and cache version
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path("assets/theme.css")
          css = css_path.read_text(encoding="utf-8")
          start = css.index("/* ── Scrollbar ── */")
          end = css.index("@media (max-width: 620px)", start)
          block = '''/* ── Scrollbar ── */
          :root {
            --scrollbar-thumb: #8b5cf6;
            --scrollbar-thumb-hover: #a678fa;
            --scrollbar-thumb-active: #7040d6;
          }

          :root[data-theme="dark"] {
            --scrollbar-thumb: #aa8be8;
            --scrollbar-thumb-hover: #bea7ee;
            --scrollbar-thumb-active: #8968cc;
          }

          * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) transparent;
          }

          *::-webkit-scrollbar {
            width: 10px;
            height: 10px;
          }

          *::-webkit-scrollbar-track,
          *::-webkit-scrollbar-corner {
            background: transparent;
          }

          *::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 999px;
          }

          *::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
          }

          *::-webkit-scrollbar-thumb:active {
            background: var(--scrollbar-thumb-active);
          }

          '''
          css_path.write_text(css[:start] + block + css[end:], encoding="utf-8")

          version = "202609092"
          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          for asset in ("icon/logo.svg", "assets/theme.css", "assets/theme.js"):
            html = re.sub(rf'({re.escape(asset)}\?v=)[^"\']+', rf'\g<1>{version}', html)
          html_path.write_text(html, encoding="utf-8")

          Path(".scrollbar-sync-trigger").unlink(missing_ok=True)
          Path(".github/workflows/scrollbar-sync.yml").unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "统一滚动条样式"
          git push
